<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sayeed Print Studio</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <main id="app">

        <h1>Sayeed Print Studio</h1>

        <p>Upload • Preview • Print</p>

        <div id="uploadBox">

            <div class="upload-icon">
                ↑
            </div>

            <h2>Upload Your File</h2>

            <p class="upload-text">
                Drop your PDF, photo or file here
            </p>

            <input
                type="file"
                id="fileInput"
                accept="image/*,.pdf"
            >

            <label
                for="fileInput"
                class="browse-btn"
            >
                Browse File
            </label>

            <div id="fileInfo"></div>

            <div id="previewArea"></div>

            <div
                id="fileActions"
                class="file-actions"
            >

                <button
                    type="button"
                    id="removeBtn"
                    class="remove-btn"
                >
                    Remove File
                </button>

                <button
                    type="button"
                    id="printBtn"
                    class="print-btn"
                >
                    Print
                </button>

            </div>

        </div>

    </main>

    <!-- PRINT ANIMATION -->
    <div
        id="printAnimation"
        class="print-animation-overlay"
        aria-hidden="true"
    >
        <div class="print-animation-card">

            <div class="print-animation-title">
                <span id="printAnimationTitle">Preparing print</span>
            </div>

            <div class="print-animation-subtitle">
                <span id="printAnimationSubtitle">
                    Your document is being prepared
                </span>
            </div>

            <div class="printer-scene">

                <div class="printer-roll">
                    <div class="roll-highlight"></div>
                    <div class="roll-shadow"></div>
                </div>

                <div class="paper-track">
                    <div
                        id="animationPaper"
                        class="animation-paper"
                    >
                        <div class="paper-inner">
                            <div class="paper-line short"></div>
                            <div class="paper-line"></div>
                            <div class="paper-line"></div>
                            <div class="paper-line medium"></div>
                            <div class="paper-line"></div>
                            <div class="paper-line short"></div>
                        </div>
                    </div>
                </div>

            </div>

            <div
                id="printAnimationStatus"
                class="print-animation-status"
            >
                Starting printer...
            </div>

        </div>
    </div>

    <script src="assets/js/app.js"></script>

</body>
</html>
