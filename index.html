<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sayeed Print Studio</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <main id="app">

    <section class="upload-section">

        <div class="brand">
            <h1>Sayeed Print Studio</h1>
            <p>Upload • Preview • Print</p>
        </div>

        <div class="upload-box" id="uploadBox">
            <div class="upload-icon">↑</div>

            <h2>Upload Your File</h2>

            <p>
                Drop your PDF, photo or file here
            </p>
            
            <input type="file" id="fileInput" accept="image/*,.pdf" hidden>

<label for="fileInput" class="browse-btn">
    Browse File
</label>
<div class="file-info" id="fileInfo">
 <div class="preview-area" id="previewArea"></div>
    <strong id="fileName"></strong>
    <span id="fileType"></span>
</div>
            <small>
                PDF • JPG • PNG • WEBP
            </small>
        </div>
<div class="processing" id="processing">
    <div class="loader"></div>
    <p>Preparing your file...</p>
</div>
    </section>

    </main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
