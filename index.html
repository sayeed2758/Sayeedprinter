<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sayeed Print Studio</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
<style>
#fileInput {
    display: none;
}

.browse-btn {
    display: inline-block;
    padding: 14px 30px;
    border-radius: 12px;
    background: #4f46e5;
    color: #ffffff;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

    <main id="app">

        <h1>Sayeed Print Studio</h1>

        <p>Upload • Preview • Print</p>

        <div id="uploadBox">

            <input
                type="file"
                id="fileInput"
                accept="image/*,.pdf"
            >
<label for="fileInput" class="browse-btn">
    Browse File
</label>
            <div id="fileInfo"></div>

            <div id="previewArea"></div>

        </div>

    </main>

    <script src="assets/js/app.js"></script>

</body>

</html>
