<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sayeed Print Studio</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>

<body>

    <main id="app">

        <h1>Sayeed Print Studio</h1>

        <p>Upload • Preview • Print</p>

        <div id="uploadBox">

            <input
                type="file"
                id="fileInput"
                accept="image/*,.pdf"
            >

            <div id="fileInfo"></div>

            <div id="previewArea"></div>

        </div>

    </main>

    <script src="assets/js/app.js"></script>

</body>

</html>
